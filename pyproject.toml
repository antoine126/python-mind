[project]
name = "python-mind"
version = "0.1.0"
description = "Corrigés et exemples de code du livre « Concevoir en Python »"
readme = "README.md"
authors = [
    { name = "Antoine Pagneux", email = "antoine.pagneux@gadz.org" }
]
requires-python = ">=3.12.7"
dependencies = []

# Dépendances optionnelles : seuls quelques chapitres en ont besoin.
# Installez-les à la demande : `uv sync --extra data` ou `--extra web`.
[project.optional-dependencies]
data = [
    "numpy>=2.0",
    "pandas>=2.2",
    "polars>=1.0",
]
web = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[project.scripts]
python-mind = "python_mind:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

# ----------------------------------------------------------------------
#  Outils
# ----------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
# Les chapitres montrent parfois du « mauvais code » à corriger : on
# n'exige pas que tout passe le linter à la lettre.
extend-exclude = ["src/python_mind/chapter-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
